name: Pages (disabled)

# Disabled for the hardened fork: the fork has no verified hosted website, and
# the site content is under review. Re-enable only once site/index.html has
# been fully updated for the fork and a verified deployment target exists.
"on":
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE to confirm the site is fork-accurate"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.inputs.confirm == 'ENABLE'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
