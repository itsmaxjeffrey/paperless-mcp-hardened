name: Release (fork)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # This is a security-hardening fork. It never publishes to npm: the upstream
    # package name (@orellbuehler/paperless-mcp) belongs to the upstream project.
    # Fork releases are consumed as source checkouts or via locally built
    # containers (see README for the supported build/run instructions).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Verify the package cannot be published to npm
        run: |
          node -e '
            const p = require("./package.json");
            if (p.private !== true) {
              console.error("package.json must set private:true; this fork must not publish to npm");
              process.exit(1);
            }
            if (p.name !== "@itsmaxjeffrey/paperless-mcp-hardened") {
              console.error("unexpected package name: " + p.name);
              process.exit(1);
            }
            console.log("package is private; npm publish would be refused");
          '
